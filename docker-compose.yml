services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      CHAIN_ID: "31337"
      RPC_URL: "http://host.docker.internal:8545"
      CLIENT: ethers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
